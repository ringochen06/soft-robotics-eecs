; Test bench firmware: pump + two steering actuators + load cell on one board.
; The lab board is a Leonardo (see firmware/pump). Use the uno env for an Uno/RedBoard.

[platformio]
default_envs = leonardo

[avr]
platform = atmelavr
framework = arduino
monitor_speed = 115200
lib_deps = bogde/HX711@^0.7.5

[env:leonardo]
extends = avr
board = leonardo

[env:uno]
extends = avr
board = uno

; Runs the firmware logic on this computer against a fake Arduino (test/shim):
;   pio test -e native -e native_pwm_dir
[env:native]
platform = native
build_flags = -std=gnu++17 -Itest/shim -Wall
test_build_src = yes

[env:native_pwm_dir]
extends = env:native
build_flags = ${env:native.build_flags} -DACT_DRIVER=1
