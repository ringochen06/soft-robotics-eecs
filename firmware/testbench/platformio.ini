; Test bench firmware: pump + two steering actuators + load cell on one board.
; The lab board is a Leonardo (see firmware/pump). Use the uno env for a RedBoard.

[platformio]
default_envs = leonardo

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200
lib_deps = bogde/HX711@^0.7.5

[env:leonardo]
board = leonardo

[env:uno]
board = uno
